<!DOCTYPE html>
<html>
	<script>
		let catgiffolder = "https://raw.githubusercontent.com/world2screen/bigcat-monster/refs/heads/main/bigcatgifs/"
		let catindex = 1
		let cats2load = 187
		
		
		function thing() {
			console.log(catindex)
			
			for (let i=catindex; i <= cats2load && i < 50+catindex; i++) {
				console.log(i)
				
				let ele = document.getElementById("cats")
				
				let img = document.createElement('img')
				img.className ="grid";
				img.src = catgiffolder + "cat%20(" + i + ").gif"
				
				ele.appendChild(img)
			}
			if (catindex+50 <= cats2load) { catindex = catindex + 50 } else { catindex = cats2load+1 }
		}
	</script>
	<style>
		.grid{
			border:1px solid #ddd;
			float:left;
			width:175px;
			height:175px;
		}
	</style>
	<body>
		<h1>meow@bigcat.monster</h1>
		dc: blablablablalhaha<br>
		current cat count 187<br>
		
		<button onclick=thing()>load 50 cats</button>
		<a href="https://downgit.github.io/#/home?url=https://github.com/world2screen/bigcat-monster/tree/main/bigcatgifs">download all cats</a>
		
		<div id="cats"></div>
	</body>
</html>
